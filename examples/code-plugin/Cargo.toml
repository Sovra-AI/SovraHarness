# Sovra's first code plugin: date sums, run in Sovra's sealed box.
# Build it with `cargo xtask plugin-wasm`, which writes `plugin.wasm` at the
# repository root beside `sovra-plugin.json`.
[package]
name = "sovra-date-helper"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.154"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Not part of the SovraHarness workspace: it builds for WebAssembly only.
[workspace]
