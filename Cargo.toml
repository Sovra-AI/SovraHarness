[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/sovra-app"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Sovra"]

# Every dependency is declared here once; members use `name = { workspace = true }`.
# cargo-deny rejects a member that pins its own version.
[workspace.dependencies]
# Internal crates
sovra-adk = { path = "crates/sovra-adk" }
sovra-core = { path = "crates/sovra-core" }
sovra-files = { path = "crates/sovra-files" }
sovra-github = { path = "crates/sovra-github" }
sovra-google = { path = "crates/sovra-google" }
sovra-mesh = { path = "crates/sovra-mesh" }
sovra-providers = { path = "crates/sovra-providers" }
sovra-runtime = { path = "crates/sovra-runtime" }
sovra-skills = { path = "crates/sovra-skills" }
sovra-store-surreal = { path = "crates/sovra-store-surreal" }
sovra-ui = { path = "crates/sovra-ui" }
sovra-telegram = { path = "crates/sovra-telegram" }
sovra-whatsapp = { path = "crates/sovra-whatsapp" }

# External crates (versions verified on crates.io 2026-10-23)
adk-agent = { version = "2.3.0", default-features = false }
adk-core = "2.3.0"
adk-model = { version = "2.3.0", default-features = false, features = ["gemini", "openai", "anthropic", "openrouter", "ollama"] }
adk-runner = { version = "2.3.0", default-features = false }
adk-session = { version = "2.3.0", default-features = false }
adk-tool = { version = "2.3.0", default-features = false }
adk-ui = { version = "2.2.0", default-features = false, features = ["adk-core"] } # compat::Tool must BE adk_core::Tool
anyhow = "1.0.104"
# Password hashing for local sign-in accounts: Argon2id with the crate's OWASP-aligned
# defaults, stored as PHC strings (salt + parameters embedded).
argon2 = "0.6.0"
# OAuth 2.0 authorization-code + PKCE client for Google Sign-In (RFC 8252 loopback flow).
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
async-channel = "2.5.0"
async-trait = "0.1.89"
# Google sign-in: PKCE verifier/state randomness and base64url (Gmail raw messages).
base64 = "0.23.1"
# Lane encryption in sovra-mesh: the versions iroh already builds (no second copies).
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
curve25519-dalek = { version = "=5.0.0", default-features = false }
# Same-room pairing in sovra-mesh: n0's mDNS address lookup for iroh, and its timer.
iroh-mdns-address-lookup = "=0.6.1"
n0-future = "0.3.2"
getrandom = "0.4.3"
# Peer-to-peer QUIC dialled by public key, with hole punching and encrypted relay
# fallback (MIT OR Apache-2.0, rustls over ring, no OpenSSL). Stable wire protocol and
# API since 1.0; see docs/roadmap/02-a-team.md §8. Metrics off: nothing reports out.
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
# Fleet-wide broadcast of signed audit checkpoints over the same iroh endpoint
# (MIT OR Apache-2.0). Metrics off, like iroh: nothing reports out.
iroh-gossip = { version = "=0.102.0", default-features = false, features = ["net"] }
# Local fine-tuning for the sovereign swarm (MIT OR Apache-2.0). Pure-Rust CPU (flex) with
# autodiff by default; `sovra-train/gpu` adds Burn's CubeCL wgpu backend.
burn = { version = "=0.22.1", default-features = false, features = ["std", "autodiff", "flex"] }
directories = "6.0.0"
futures = "0.3.32"
# Official MCP server SDK; stdio only, owned by sovra-runtime.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
fastcdc = { version = "5.0.0", default-features = false }
notify = "8.2.0"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
caseless = "0.2.2"
unicode-normalization = "0.1.26"
unicode-bidi = "0.3.18"
file-format = { version = "0.29.0", features = ["reader-cfb", "reader-mp4", "reader-ebml", "reader-xml"] }
sha2 = "0.11.1"
# Content addresses for the sovereign-swarm audit ledger and shared records (roadmap D5).
# Already built for iroh; CC0-1.0 / Apache-2.0.
blake3 = "1.8.7"
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
# Pin the streaming plist API so depth/output budgets can be enforced before tree allocation.
plist = { version = "=1.10.3", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
flate2 = "1.1.10"
bzip2-rs = "0.1.2"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz", "lzip"] }
ruzstd = "0.9.1"
# HTML parsing for reading web pages the search helper opens (pure Rust, html5ever).
scraper = { version = "0.27.0", default-features = false }
# 0.39 (libsqlite3-sys 0.37): Cargo links one SQLite per binary, and the WhatsApp client's
# credential store (`whatsapp-rust-sqlite-storage`, via diesel) pins libsqlite3-sys 0.37.
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled", "serialize", "limits", "hooks", "functions"] }
# Open-source WhatsApp Web (multi-device) client, MIT, pure Rust + rustls. `tracing` routes its
# logs into ours; no `signal` (we own shutdown) and no `simd` (keeps the stable toolchain).
whatsapp-rust = { version = "0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tracing"] }
# Renders the pairing payload WhatsApp issues as a QR module grid the UI paints.
qrcode = { version = "0.14.1", default-features = false }
tar = "0.4.46"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
http = "1.4.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm", "tga", "qoi", "hdr", "dds", "exr", "ff"] }
infer = "0.22.0"
mime_guess = "2.0.5"
# Numerical revisions are part of the derived-map algorithm contract.
umap-rs = "=0.4.5"
ndarray = "0.17.2"
rayon = "1.12.0"
memchr = "2.8.3"
# Safe `killpg` and `openpty` so the terminal tool stops a command's whole process
# group and captures live libc output on a tty (Unix only). `fs` is F_SETFD/CLOEXEC.
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "term", "fs"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
# exact: GPUI has no semver promise; bump deliberately. `syntect` highlights chat code
# blocks with pure-Rust regexes (no C deps); results are cached per unchanged block.
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
gpui-bidi = "=0.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["serialize", "deserialize"] }
# >=3.3.4: HNSW silently dropped near-duplicate vectors before 3.3.4. BUSL-1.1 licence —
# permitted for embedding in this app (see docs/architecture.md), excepted in deny.toml.
surrealdb = { version = "3.3.4", features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
# `process`: the terminal tool runs shell commands (sovra-runtime only).
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "process"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
velopack = "1.2.161"
# Local document parsers only: no hosted OCR, model downloads, servers, or native PDFium.
xberg = { version = "=1.3.10", default-features = false, features = ["pdf", "office", "excel-wasm", "email", "html", "xml", "iwork", "hwp", "notebook", "mdx"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in an application.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
# Restriction lints we opt into.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
unwrap_used = "deny"
get_unwrap = "deny"
rc_mutex = "deny"
redundant_clone = "warn"
use_self = "warn"
disallowed_methods = "deny"

[profile.dev]
debug = "line-tables-only"

# Optimise dependencies (GPUI rendering, parsers) even in dev; keep our crates fast to rebuild.
# No debug info for dependencies: it was most of target/debug/deps, and backtraces still
# name dependency frames; only our crates keep line tables.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.build-override]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# `cargo build --profile profiling` for flamegraphs/Instruments.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = false
