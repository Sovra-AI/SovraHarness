[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/sovra-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "LicenseRef-Proprietary"
publish = false
authors = ["Sovra"]

# Every dependency is declared here once; members use `name = { workspace = true }`.
# cargo-deny rejects a member that pins its own version.
[workspace.dependencies]
# Internal crates
sovra-adk = { path = "crates/sovra-adk" }
sovra-core = { path = "crates/sovra-core" }
sovra-providers = { path = "crates/sovra-providers" }
sovra-runtime = { path = "crates/sovra-runtime" }
sovra-store-surreal = { path = "crates/sovra-store-surreal" }
sovra-ui = { path = "crates/sovra-ui" }

# External crates (versions verified on crates.io 2026-10-23)
adk-agent = { version = "2.3.0", default-features = false }
adk-core = "2.3.0"
adk-model = { version = "2.3.0", default-features = false, features = ["gemini", "openai", "anthropic", "openrouter", "ollama"] }
adk-runner = { version = "2.3.0", default-features = false }
adk-session = { version = "2.3.0", default-features = false }
adk-tool = { version = "2.3.0", default-features = false }
adk-ui = { version = "2.2.0", default-features = false, features = ["adk-core"] } # compat::Tool must BE adk_core::Tool
anyhow = "1.0.104"
async-channel = "2.5.0"
async-trait = "0.1.89"
directories = "6.0.0"
futures = "0.3.32"
http = "1.4.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
gpui-kit = "=0.8.0" # exact: GPUI has no semver promise; bump deliberately
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# >=3.3.4: HNSW silently dropped near-duplicate vectors before 3.3.4. BUSL-1.1 licence —
# permitted for embedding in this app (see docs/architecture.md), excepted in deny.toml.
surrealdb = { version = "3.3.4", features = ["kv-mem", "kv-surrealkv"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
velopack = "1.2.161"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in an application.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
# Restriction lints we opt into.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
unwrap_used = "deny"
get_unwrap = "deny"
rc_mutex = "deny"
redundant_clone = "warn"
use_self = "warn"
disallowed_methods = "deny"

[profile.dev]
debug = "line-tables-only"

# Optimise dependencies (GPUI rendering, parsers) even in dev; keep our crates fast to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# `cargo build --profile profiling` for flamegraphs/Instruments.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = false
