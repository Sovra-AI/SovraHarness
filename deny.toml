# cargo-deny: supply-chain and architecture gates. Run via `cargo xtask ci`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
yanked = "deny"
# Flag unmaintained crates we depend on directly; transitive ones (GPUI's tree) are
# upstream's to replace and would otherwise block every build.
unmaintained = "workspace"
ignore = [
  # zip 8.x extraction flaws, reachable only through velopack (pins zip ^8.6) when it
  # unpacks an update package. Our packages come from our own feed and are hash-verified
  # by Velopack before extraction. Remove once velopack moves to zip >= 9.
  { id = "RUSTSEC-2026-0367", reason = "velopack pins zip ^8.6; update packages are first-party and hash-verified" },
  { id = "RUSTSEC-2026-0368", reason = "velopack pins zip ^8.6; update packages are first-party and hash-verified" },
  { id = "RUSTSEC-2026-0369", reason = "velopack pins zip ^8.6; update packages are first-party and hash-verified" },
  { id = "RUSTSEC-2026-0429", reason = "velopack pins zip ^8.6; ZipArchive::extract abort is the same update-package path, and Sovra does not call extract" },
  # Inside surrealdb-core, unreachable from our embedded use. Re-check on surrealdb bumps.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via surrealdb's object_store (S3/GCS) backend; we never configure a remote object store or parse untrusted XML" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via surrealdb's object_store backend; same as above" },
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing side-channel via surrealdb's jsonwebtoken auth; embedded engine has no network auth surface and no patched rsa exists" },
  # User-approved 2026-11-04: calamine's CFB parser can panic or over-allocate on a crafted
  # .xls/.xlsb (denial of service only, no memory unsafety). xberg 1.3.10, the latest,
  # pins calamine ^0.36; the fix is in 0.38. Remove when xberg moves to calamine >= 0.38.
  { id = "RUSTSEC-2026-0436", reason = "Approved exception: xberg =1.3.10 pins calamine ^0.36 and no fixed xberg exists; impact is a crash/OOM on a crafted spreadsheet attachment, not memory unsafety. Remove when xberg uses calamine >=0.38." },
  { id = "RUSTSEC-2026-0387", reason = "Approved exception: crypto-bigint 0.5 is pulled in by SurrealDB's WebAssembly-only jsonwebtoken rust_crypto backend; absent from Linux x86_64, Windows x86_64 and macOS arm64 release graphs. Remove when that upstream chain uses crypto-bigint >=0.7.6." },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "BUSL-1.1", # only the clarified surrealdb-* crates carry this; see note above exceptions
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016", # finl_unicode (xberg → comrak): OSI-approved Unicode data licence
  "Unlicense", # public-domain dedication (ext-sort)
  "Zlib",
  "0BSD",
]

# finl_unicode 1.5.0's manifest still names Unicode-DFS-2016, but its bundled
# LICENSE-UNICODE is exactly SPDX Unicode-3.0 (whitespace normalized). Preserve
# the MIT/Apache choice and additional Unicode obligation; no allow-list change.
# Exact version + all three text hashes require review on upstream changes.
# Evidence and SHA-256 fingerprints: docs/agent-memory.md, License clarification.
[[licenses.clarify]]
crate = "finl_unicode@1.5.0"
expression = "(MIT OR Apache-2.0) AND Unicode-3.0"
license-files = [
  { path = "LICENSE-MIT", hash = 0x386ca1bc },
  { path = "LICENSE-APACHE", hash = 0xb5518783 },
  { path = "LICENSE-UNICODE", hash = 0x3475d800 },
]

# SurrealDB v3 ships under BUSL-1.1 (converts to Apache-2.0 on 2030-01-01). Its grant
# permits embedding here: we use it for the app's own storage and never offer it to
# third parties as a database service. The crates use a non-SPDX `license-file`, so each
# surrealdb-* crate is clarified below as BUSL-1.1; keep the clarify list in sync when
# the SurrealDB tree grows. See docs/architecture.md for the legal note.

[[licenses.clarify]]
crate = "surrealdb"
expression = "BUSL-1.1"
license-files = []

