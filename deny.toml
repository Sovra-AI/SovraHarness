# MIT upstream but the manifest omits the license field; treat the crate's licence
# text as authoritative. https://github.com/TannerRogalsky/tokio-tungstenite-wasm
[[licenses.clarify]]
crate = "tokio-tungstenite-wasm"
expression = "MIT"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow" # GPUI's tree has unavoidable duplicates; revisit when it stabilises
wildcards = "deny"
allow-wildcard-paths = true
# Workspace architecture (who may depend on tokio, gpui-kit, …) is enforced by
# `cargo xtask check-deps`; this list is for crates banned outright.
deny = [
  { crate = "openssl", reason = "use rustls; native OpenSSL complicates cross-platform distribution" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
