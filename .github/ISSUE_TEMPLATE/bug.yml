name: Bug
description: Something is broken or unexpected
title: "🐛 "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow [SECURITY.md](https://github.com/Sovra-AI/SovraHarness/blob/main/SECURITY.md). Do not post security details here.
        Remove keys, tokens, and personal data from logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Numbered steps from launching the app. Say whether you used a release or a source build.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
        - Several
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: App version, or `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant lines. Strip API keys and tokens.
      render: text
