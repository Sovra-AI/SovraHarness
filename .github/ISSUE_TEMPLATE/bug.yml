name: Bug
description: Something is broken or unexpected
title: "🐛 "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Numbered steps, starting from a fresh `cargo xtask dev` if you can.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Windows
        - Linux
        - Several
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: App version, or `git rev-parse --short HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant lines. Strip API keys and tokens.
      render: text
