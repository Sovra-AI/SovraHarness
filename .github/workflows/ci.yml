# Pull requests and pushes to main. Local definition of done remains `cargo xtask ci`.
#
# Layout (GitHub Free private-repo minutes; macOS is 10× Linux):
#   lint     Ubuntu — fmt, layering, styles, docs, deny, shear, clippy
#   test     macOS  — nextest, including headless GPUI UI tests
#   nearby   Ubuntu — same-room code tests (macOS 15 runners block local multicast)
#   compile  Windows — cargo check so the shipped OS still builds
#   changelog PR-only — CHANGELOG.md must change (label skip-changelog to skip)
#   CI       aggregator — the single status to require once GitHub Team is on
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      revision:
        description: Optional release tag or commit to validate
        type: string
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    # fmt, layering, styles, docs, deny, shear, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: ./scripts/install-linux-deps.sh
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0
      - run: cargo fmt --all --check
      - run: cargo xtask check-deps
      - run: cargo xtask check-styles
      - run: cargo xtask check-docs
      - run: cargo deny --all-features check
      - run: cargo shear
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: macos-15
    # A cold build of the test executables alone takes over 45 minutes.
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.149
      # Same-room code tests run in the nearby job: macOS 15 blocks the runner's
      # local-network multicast (.config/nextest.toml says why).
      - run: cargo nextest run --workspace --locked --no-tests pass --profile macos-ci

  nearby:
    name: Nearby (Linux)
    # The same-room code tests need local-network multicast, which Linux runners allow.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: ./scripts/install-linux-deps.sh
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --locked --package sovra-app --package sovra-mesh --profile nearby

  compile:
    name: Compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked --all-targets

  changelog:
    name: Changelog
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CHANGELOG.md must change on this pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qx CHANGELOG.md; then
            exit 0
          fi
          echo "::error title=Changelog::Update CHANGELOG.md under ## [Unreleased] (CONTRIBUTING.md). Add the skip-changelog label for a docs-only or CI-only change that has nothing to record."
          exit 1

  CI:
    name: CI
    if: always() && !cancelled()
    needs: [lint, test, nearby, compile, changelog]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "nearby=${{ needs.nearby.result }}"
          echo "compile=${{ needs.compile.result }}"
          echo "changelog=${{ needs.changelog.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.nearby.result }}" = success
          test "${{ needs.compile.result }}" = success
          case "${{ needs.changelog.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
