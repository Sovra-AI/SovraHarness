# Push to main, or a matching vX.Y.Z tag → build per OS → sign/notarize when
# secrets exist → Velopack installers + update feeds → GitHub Release.
# The package version comes from Cargo.toml. It is never the branch name.
# Update feeds are produced; in-app update checks are not implemented yet.
# A version already published is not published again.
#
# Required secrets (set before the first release; jobs skip signing when absent):
#   macOS:   BUILD_CERTIFICATE_BASE64, INSTALLER_CERTIFICATE_BASE64, P12_PASSWORD,
#            KEYCHAIN_PASSWORD, APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM,
#            MAC_SIGN_NAME (e.g. "Your Org", used in "Developer ID Application: <name>")
#   Windows: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC), plus
#            packaging/windows/artifact-signing.json (Endpoint, CodeSigningAccountName,
#            CertificateProfileName)
# Docs: https://docs.velopack.io/packaging/signing
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  PACK_ID: SovraHarness

jobs:
  package:
    name: Package (${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, channel: osx, exe: sovra } # Apple Silicon
          - { os: windows-latest, channel: win, exe: sovra.exe }
          - { os: ubuntu-24.04, channel: linux, exe: sovra }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # Azure OIDC for Windows signing
    env:
      HAS_MAC_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
      HAS_WIN_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: ./scripts/install-linux-deps.sh
      - run: rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install -g vpk --version 1.2.161

      - name: Read the package version
        id: package_version
        shell: bash
        run: |
          # The download feed uses the workspace package version. A push to
          # main must not publish the branch name.
          version=$(awk '
            $0 == "[workspace.package]" { in_pkg = 1; next }
            in_pkg && /^\[/ { in_pkg = 0 }
            in_pkg && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [[ "$version" == "main" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Package version must be a semantic version, not the branch name (got: ${version:-empty})."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --package sovra-app
          mkdir -p target/pack
          cp "target/release/${{ matrix.exe }}" target/pack/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: executable-${{ matrix.channel }}
          path: target/release/${{ matrix.exe }}
          if-no-files-found: error

      - name: Import macOS signing certificates
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.INSTALLER_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/build.p12"
          echo -n "$INSTALLER_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/build.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/installer.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          xcrun notarytool store-credentials velopack-profile \
            --apple-id "${{ secrets.APPLE_ID }}" --team-id "${{ secrets.APPLE_TEAM }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" --keychain "$KEYCHAIN"

      - if: runner.os == 'Windows' && env.HAS_WIN_SIGNING == 'true'
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package with Velopack
        shell: bash
        run: |
          version="${{ steps.package_version.outputs.version }}"
          ARGS=(pack --packId "$PACK_ID" --packVersion "$version" --packDir target/pack
                --mainExe "${{ matrix.exe }}" --channel "${{ matrix.channel }}" --outputDir target/dist)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ARGS+=(--bundleId com.sovra.harness --signEntitlements packaging/macos/sovra.entitlements)
            [[ -f packaging/macos/icon.icns ]] && ARGS+=(--icon packaging/macos/icon.icns)
            if [[ "$HAS_MAC_SIGNING" == "true" ]]; then
              ARGS+=(--signAppIdentity "Developer ID Application: ${{ secrets.MAC_SIGN_NAME }}"
                     --signInstallIdentity "Developer ID Installer: ${{ secrets.MAC_SIGN_NAME }}"
                     --notaryProfile velopack-profile --keychain "$RUNNER_TEMP/app-signing.keychain-db")
            fi
          fi
          if [[ "$RUNNER_OS" == "Windows" && "$HAS_WIN_SIGNING" == "true" ]]; then
            ARGS+=(--azureTrustedSignFile packaging/windows/artifact-signing.json)
          fi
          vpk "${ARGS[@]}"

      - name: Remove temporary keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.channel }}
          path: target/dist

  publish:
    name: Publish GitHub Release + update feeds
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install -g vpk --version 1.2.161
      - name: Upload each channel to one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk '
            $0 == "[workspace.package]" { in_pkg = 1; next }
            in_pkg && /^\[/ { in_pkg = 0 }
            in_pkg && /^version = / { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)
          if [[ "$version" == "main" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to publish the branch name as a version (got: ${version:-empty})."
            exit 1
          fi
          tag="v$version"
          # Asset names are unique. macOS and Linux both build `sovra`, so the
          # release lists them as sovra-macos and sovra-linux. Windows is sovra.exe.
          # A tag with no assets, or with only some of these, is not updated yet.
          required=(sovra-macos sovra.exe sovra-linux)
          have_all=0
          if assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null); then
            have_all=1
            for name in "${required[@]}"; do
              if ! grep -qx "$name" <<< "$assets"; then
                echo "$tag is missing $name"
                have_all=0
              fi
            done
          fi
          if [[ "$have_all" == "1" ]]; then
            echo "$tag already has the macOS, Windows, and Linux executables. The same version is not published again."
            exit 0
          fi
          for channel in osx win linux; do
            vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" \
              --token "$GH_TOKEN" --outputDir "dist/dist-$channel" --channel "$channel" \
              --tag "$tag" --releaseName "SovraHarness $tag" \
              --merge --publish
          done
          gh release upload "$tag" --repo "${{ github.repository }}" --clobber \
            "dist/executable-osx/sovra#sovra-macos" \
            "dist/executable-win/sovra.exe#sovra.exe" \
            "dist/executable-linux/sovra#sovra-linux"
          assets=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for name in "${required[@]}"; do
            if ! grep -qx "$name" <<< "$assets"; then
              echo "::error::Release $tag is missing the executable $name."
              exit 1
            fi
          done
