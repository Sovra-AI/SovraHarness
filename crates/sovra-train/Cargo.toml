[package]
name = "sovra-train"
description = "Local training for the sovereign swarm: Burn models behind the core training ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Burn's CubeCL GPU backend (Vulkan, Metal, DX12 through wgpu). `sovra-app` turns it
# on; the engine then trains on a card only when one passes its own checks. Off by
# default so this crate alone builds and tests the processor engine quickly.
gpu = ["burn/wgpu"]

[dependencies]
burn = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sovra-core = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
