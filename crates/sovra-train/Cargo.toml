[package]
name = "sovra-train"
description = "Local training for the sovereign swarm: Burn models behind the core training ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Burn's CubeCL GPU backend (Vulkan, Metal, DX12 through wgpu). Off by default so every
# laptop and CI builds the CPU trainer only.
gpu = ["burn/wgpu"]

[dependencies]
burn = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sovra-core = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
