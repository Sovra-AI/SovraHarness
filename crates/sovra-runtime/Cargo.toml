[package]
name = "sovra-runtime"
description = "Async engine: owns the tokio runtime on a background thread and serves the UI over channels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
# `client` + child processes: programs on this computer as connected services.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sovra-adk = { workspace = true }
sovra-core = { workspace = true }
sovra-providers = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rmcp = { workspace = true, features = ["client"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
